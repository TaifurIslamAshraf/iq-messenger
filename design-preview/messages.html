<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQ Message — Messages design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;width:411px;max-width:100vw;background:#eeedf1;font-family:Arial,sans-serif;color:#121214}
button{font:inherit;cursor:pointer}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.phone{width:411px;max-width:100vw;height:915px;max-height:100vh;min-height:650px;position:relative;margin:auto;background:white;overflow:hidden;display:flex;flex-direction:column}
.status{height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:12px;font-weight:600}.status span:last-child{display:flex;align-items:center;gap:6px}.status svg{width:15px;height:15px;stroke-width:1.8}
.scroll{overflow:auto;flex:1;padding-bottom:95px}.header{padding:8px 4px 0 20px}.title-row{display:flex;align-items:center;justify-content:space-between;gap:0}.title-copy{flex:1;min-width:0}.header-actions{display:flex;align-items:center;gap:0;flex-shrink:0}.title-row h1{margin:0;font-size:27.3px;line-height:32.9px;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{margin:4px 0 0;font-size:13.5px;line-height:19px;color:#6c6e76}
.more{width:48px;height:48px;border:0;background:radial-gradient(circle at center,#f7f7f9 0 20px,transparent 20px);border-radius:50%;display:grid;place-items:center;color:#121214}.more svg{width:22px;height:22px}
.conversations{padding-top:12px}.chat{display:flex;align-items:center;gap:12px;min-height:78px;padding:12px;margin:2px 8px;border-radius:20px}.chat.unread{background:#fff6f8}.avatar{display:grid;place-items:center;flex:0 0 54px;height:54px;border-radius:50%;font-size:18px;font-weight:600;color:white;background:linear-gradient(135deg,var(--a),var(--b))}.text{min-width:0;flex:1}.name{display:flex;align-items:center;gap:4px;font-size:16.45px;line-height:23px;font-weight:600;letter-spacing:-.2px}.name span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.verified{color:#e8114c;width:17px;height:17px;fill:currentColor;stroke:none}.message{margin-top:3px;font-size:14.25px;line-height:21px;color:#6c6e76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread .name{font-weight:700}.unread .message{color:#121214;font-weight:600}.meta{display:flex;align-items:flex-end;flex-direction:column;gap:8px;align-self:center}.time{font-size:12px;line-height:16px;color:#6c6e76;white-space:nowrap}.unread .time{color:#e8114c;font-weight:600}.badges{height:23px;display:flex;gap:4px;align-items:center}.badges svg{width:18px;height:18px;color:#6c6e76}.badge{display:grid;place-items:center;min-width:23px;height:23px;background:#e8114c;color:white;border-radius:50%;font-size:12px;font-weight:700;padding:0 6px}
.compose{position:absolute;bottom:110px;right:20px;display:flex;align-items:center;gap:8px;min-height:54px;border:0;border-radius:18px;background:#e8114c;color:white;padding:12px 16px;box-shadow:0 4px 10px #e8114c20;font-size:14.5px;font-weight:600}.compose svg{width:20px;height:20px;stroke-width:1.8}
.nav{height:92px;border-top:1px solid #eaeaee;flex-shrink:0;display:flex;justify-content:space-evenly;padding:8px 8px 20px;background:white}.nav button{position:relative;border:0;background:none;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:12px;color:#2a2b30}.nav button.active{color:#e8114c;font-weight:600}.nav svg{width:24px;height:24px}.nav .notification{position:absolute;top:0;left:calc(50% + 4px);border-radius:12px;padding:2px 6px;font-size:10.5px;color:#fff;background:#e8114c;font-weight:700}.gesture{position:absolute;bottom:8px;width:115px;height:4px;left:calc(50% - 57.5px);background:#121214;border-radius:3px}.note{max-width:411px;margin:16px auto;color:#6c6e76;font-size:12px;line-height:1.5;padding:0 16px}.note a{color:#c9003f}
@media(max-width:360px){.header{padding-left:16px;padding-right:16px}.title-row h1{font-size:25.5px}.chat{gap:10px;padding:10px}.avatar{height:46px;flex-basis:46px;font-size:16px}.name{font-size:15.5px}.message{font-size:13.2px}.time{font-size:10.5px}.meta{gap:6px}.compose{right:16px;min-height:50px;font-size:13px}}
.profile{display:grid;place-items:center;flex:0 0 44px;height:44px;border:1px solid #eaeaee;border-radius:50%;background:#f7f7f9;margin-right:12px}.profile svg{width:22px;height:22px}.chat:after{content:none}
@media(max-width:360px){.header{padding:8px 3px 0 16px}.profile{height:35px;flex-basis:35px;margin-right:10px}.title-row h1{font-size:21px}}
</style>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="profile" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.9 20c0-3.6 3.2-5.4 7.1-5.4s7.1 1.8 7.1 5.4"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.9"/><path d="M15.7 15.7 20.4 20.4"/></symbol>
<symbol id="camera" viewBox="0 0 24 24"><path d="M8.2 6.2 9.5 3.8h5l1.3 2.4h3.1c1.7 0 2.6 1 2.6 2.6v8.6c0 1.7-.9 2.7-2.6 2.7H5.1c-1.7 0-2.6-1-2.6-2.7V8.8c0-1.6.9-2.6 2.6-2.6Z"/><circle cx="12" cy="12.9" r="3.5"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="12" cy="4.9" r="1.85"/><circle cx="12" cy="12" r="1.85"/><circle cx="12" cy="19.1" r="1.85"/></g></symbol>
<symbol id="compose" viewBox="0 0 24 24"><path d="M11 4H7C4.8 4 3.5 5.3 3.5 7.5V17C3.5 19.2 4.8 20.5 7 20.5H16.5C18.7 20.5 20 19.2 20 17V13M10 14 10.8 10.3 17.8 3.3Q18.8 2.3 19.8 3.3L20.7 4.2Q21.7 5.2 20.7 6.2L13.7 13.2ZM16.5 4.6 19.4 7.5"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 3.8h8a4.6 4.6 0 0 1 4.6 4.6v4.2a4.6 4.6 0 0 1-4.6 4.6H9.4l-4.5 3.4-1.5-5.2v-7A4.6 4.6 0 0 1 8 3.8Z"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M20.6 16.9v2.5a1.9 1.9 0 0 1-2.1 1.9C10.4 20.4 3.6 13.6 2.7 5.5a1.9 1.9 0 0 1 1.9-2.1h2.5A1.9 1.9 0 0 1 9 5c.1.9.4 1.8.7 2.7a1.9 1.9 0 0 1-.4 2L8 10.9a15.2 15.2 0 0 0 5.1 5.1l1.2-1.3a1.9 1.9 0 0 1 2-.4c.9.3 1.8.6 2.7.7a1.9 1.9 0 0 1 1.6 1.9Z"/></symbol>
<symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8.2" r="3.4"/><path d="M2.6 19.8c0-3.4 3-5.1 6.4-5.1s6.4 1.7 6.4 5.1M16 5.3a3.4 3.4 0 0 1 0 5.9M17.4 15.1c2.6.6 4.2 2.2 4.2 4.7"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.4 1.1 6.3L12 17.3l-5.6 3 1.1-6.3L3 9.6l6.2-.9Z"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.6V2.9M12 18.4v2.7M5.6 12H2.9M18.4 12h2.7M7.5 7.5 5.6 5.6M16.5 16.5l1.9 1.9M7.5 16.5l-1.9 1.9M16.5 7.5l1.9-1.9"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="m8 4 8 0-1 6 3 4H6l3-4ZM12 14v7"/></symbol>
</defs></svg>
<main class="phone" aria-label="Messages design preview with sample conversations">
<div class="status"><span>9:41</span><span><svg viewBox="0 0 24 24"><path d="M3 19v-3m5 3v-7m5 7V8m5 11V4"/></svg><svg viewBox="0 0 24 24"><path d="M3 8q9-8 18 0M6 12q6-5 12 0M9 16q3-3 6 0"/><circle cx="12" cy="20" r=".7"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="6" width="18" height="12" rx="3"/><path d="M22 10v4"/><rect x="4.5" y="8.5" width="12" height="7" rx="1" fill="currentColor" stroke="none"/></svg></span></div>
<div class="scroll"><header class="header"><div class="title-row"><div class="profile" aria-label="Your profile"><svg><use href="#profile"/></svg></div><div class="title-copy"><h1>Messages</h1></div><div class="header-actions"><button class="more" aria-label="Search"><svg><use href="#search"/></svg></button><button class="more" aria-label="Camera"><svg><use href="#camera"/></svg></button><button class="more" aria-label="More options"><svg><use href="#more"/></svg></button></div></div></header><section class="conversations" id="conversations" aria-label="Sample conversations"></section></div>
<button class="compose"><svg><use href="#compose"/></svg>New message</button>
<nav class="nav" aria-label="Existing navigation"><button class="active"><svg><use href="#chat"/></svg><span class="notification">2</span>Chats</button><button><svg><use href="#phone"/></svg>Calls</button><button><svg><use href="#people"/></svg>People</button><button><svg><use href="#star"/></svg>Rewards</button><button><svg><use href="#settings"/></svg>Settings</button></nav><div class="gesture"></div>
</main>
<p class="note">Design review · Sample conversations · HTML approximation of the native Messages page. Reels appear in the app when available. Other pages and navigation are unchanged.</p>
<script>
const people=[['Ayesha Rahman','See you at the cafe!','9:41 AM',2,'#ae8c9e','#6b4c5c'],['Rafi Ahmed','The new design looks great','9:28 AM',1,'#7fa8a0','#44706b'],['Nusrat Jahan','You: Thanks, talk soon!','8:56 AM',0,'#8e9bb3','#4e5a72'],['Sakib Hasan','Sent you the photos','8:30 AM',0,'#c29279','#7a5140'],['Tania Islam','Are we still on for tomorrow?','Yesterday',0,'#8891b5','#4b5375'],['Arif Khan','You: Sounds like a plan','Yesterday',0,'#9ea98b','#5c6650'],['Mehedi Hasan','Catch up this weekend?','Monday',0,'#b78f97','#74505a']];
document.getElementById('conversations').innerHTML=people.map(([name,message,time,unread,a,b],i)=>`<article class="chat ${unread?'unread':''}"><div class="avatar" style="--a:${a};--b:${b}">${name.split(' ').map(n=>n[0]).slice(0,2).join('')}</div><div class="text"><div class="name"><span>${name}</span>${i===0?'<svg class="verified" viewBox="0 0 24 24"><path d="m12 1 3 2 4 .5 1.5 4L23 12l-2.5 4.5-1.5 4-4 .5-3 2-3-2-4-.5-1.5-4L1 12l2.5-4.5 1.5-4 4-.5Z"/><path d="m7 12 3 3 7-7" fill="none" stroke="white" stroke-width="2"/></svg>':''}</div><div class="message">${message}</div></div><div class="meta"><span class="time">${time}</span><div class="badges">${i===0?'<svg><use href="#pin"/></svg>':''}${unread?`<span class="badge">${unread}</span>`:''}</div></div></article>`).join('');
</script>
</html>
