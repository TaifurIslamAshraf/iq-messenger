[versions]
agp = "9.2.1"
sentry = "6.27.0"
media3 = "1.8.0"
coreKtx = "1.19.0"
junit = "4.13.2"
orgJson = "20240303"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
socketIo = "2.1.2"
googleServices = "4.4.3"
firebaseBom = "34.1.0"
livekit = "2.29.0"
# Room needs an annotation processor, and KSP is tied to the Kotlin version.
ksp = "2.2.10-2.0.2"
room = "2.8.5"
work = "2.12.0"
zxing = "3.5.3"
camera = "1.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# Lets a composable watch the lifecycle, which is how the push token is refreshed
# every time the app comes to the foreground rather than only on first composition.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# The one third-party runtime dependency: Android ships no WebSocket client, and
# the messenger realtime layer is Socket.IO v4.
socket-io-client = { group = "io.socket", name = "socket.io-client", version.ref = "socketIo" }
# Push. Android has no way to be woken for a message while the app is closed that
# does not go through FCM, so this one is not a choice between libraries.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# Calls. The media never touches the messenger API: it hands back a LiveKit room and
# a token, and this is what connects to it. There is no writing around it - the
# alternative is WebRTC by hand.
livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
# The local store. The chat is read from here and written to the network, rather
# than the other way round, so a thread that has been opened once opens again with
# no connection at all.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# Drawing a QR code. The server hands back ten characters and says "put exactly
# this in the QR image"; turning a string into that image is Reed-Solomon coding
# and mask selection, which is a library's job and not a file in this app.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Reading one: CameraX for the preview and the frames, ZXing (above) to find the
# code in them. Google's code scanner was tried first, but it is a module Play
# services downloads on first use, and where that download fails - no Google
# account, no Play services - the scanner never opened. The camera permission is
# already held for video calls.
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
# Reels. ExoPlayer under its current name: HLS for Cloudflare Stream's manifests,
# the cache for keeping what was downloaded, and the preload manager that loads the
# next reels ahead of a swipe.
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
sentry-android = { id = "io.sentry.android.gradle", version.ref = "sentry" }

